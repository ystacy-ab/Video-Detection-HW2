# One-stage anchor-based baseline: torchvision retinanet_resnet50_fpn_v2 defaults, COCO weights.
# Same protocol as Faster R-CNN (frames, input size, epochs, optimiser, ignore handling, evaluation).
_base_: frcnn_baseline.yaml
experiment: retinanet_baseline

model:
  arch: retinanet_resnet50_fpn_v2
  anchor_sizes: [32, 64, 128, 256, 512]   # base size per level P3..P7 (torchvision default)
  anchor_scales: [1.0, 1.26, 1.587]       # 3 octave scales 2^(0, 1/3, 2/3) -> 9 anchors / location
  aspect_ratios: [0.5, 1.0, 2.0]
  fg_iou_thresh: 0.5                      # anchor IoU >= 0.5 -> positive
  bg_iou_thresh: 0.4                      # IoU < 0.4 -> negative, in between -> ignored
  focal_alpha: 0.25
  focal_gamma: 2.0
  topk_candidates: 1000                   # per level before NMS
  box_nms_thresh: 0.5
  box_score_thresh: 0.001
  box_detections_per_img: 500
