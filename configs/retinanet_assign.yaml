# Ablation 2: positive / negative IoU thresholds (on top of the small anchors).
# Small boxes rarely reach IoU 0.5 with any anchor (a 2 px shift of a 12 px box already costs ~30 % IoU),
# so they get only the single "low-quality" match. Lower thresholds give them more positive anchors.
_base_: retinanet_anchors.yaml
experiment: retinanet_assign

model:
  fg_iou_thresh: 0.4
  bg_iou_thresh: 0.3
